[build]
# Use a repo-wide glob so GitHub autodeploy never "skips" this service. Narrow
# patterns like `/platform/ens-resolver/**` have repeatedly failed to match the
# commit file list (root directory + Railway matcher quirks), which blocks
# shipping gateway fixes until someone runs "Deploy latest" by hand.
watchPatterns = ["**"]

[deploy]
startCommand = "bun run start"
# Use `/` so deploy health does not depend on signal-api (see GET /health for full probe).
healthcheckPath = "/"
healthcheckTimeout = 90
restartPolicyType = "on_failure"
