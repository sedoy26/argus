[build]
# Railway default is RAILPACK; "nixpacks" is no longer a valid builder in config-as-code and can fail the image build.
# From repo root: only redeploy this service when its package changes (GitHub push autodeploy).
watchPatterns = ["/dashboard/**"]

[deploy]
startCommand = "bun run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
